{% extends "base.html" %}{% block title %}Job{% endblock %}{% block content %}<div class="formwrap"><span class="tag">{{job.company or 'Company'}}</span><h1>{{job.title}}</h1><section class="card"><h2>Required Skills</h2><div class="skills">{% for s in job.required_skills.split(',') %}<span>{{s.strip()}}</span>{% endfor %}</div><h2>Job Description</h2><p>{{job.description}}</p><a class="btn primary" href="{{url_for('candidate.apply',job_id=job.id)}}">Apply & Analyze Resume →</a></section></div>{% endblock %}
